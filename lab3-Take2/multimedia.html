<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multimédia - Dnipro</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* --- RESET E BASE --- */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background-color: #f5f6fa;
        color: #333;
      }

      /* --- SECÇÃO DE DESTAQUE --- */
      .multi-destaque {
        position: relative;
        width: 100%;
        height: 60vh;
        overflow: hidden;
      }
      .imagem-container {
        width: 100%;
        height: 100%;
        position: relative;
      }
      .img-full {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(70%); /* Escurece a imagem para destacar o texto */
      }
      .texto-emblematico {
        position: absolute;
        bottom: 40px;
        left: 40px;
        color: white;
        font-size: 3rem;
        font-weight: 700;
        text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.6);
      }

      /* --- SECÇÃO DE FOTOS --- */
      .multi-fotos {
        padding: 60px 20px;
        text-align: center;
        background-color: #ffffff;
      }
      .multi-fotos h2 {
        font-size: 2.2rem;
        margin-bottom: 20px;
        color: #2c3e50;
      }
      .foto-efeito {
        width: 100%;
        max-width: 600px;
        height: auto;
        border-radius: 12px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        transition:
          transform 0.4s ease,
          box-shadow 0.4s ease;
      }
      .foto-efeito:hover {
        transform: scale(
          1.03
        ); /* Efeito suave de aproximação ao passar o rato */
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      }

      /* --- EFEITO 1: VÍDEO DE FUNDO (VIDEO BACKGROUND) --- */
      .video-bg-section {
        position: relative;
        height: 60vh;
        width: 100%;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .video-bg {
        position: absolute;
        top: 50%;
        left: 50%;
        min-width: 100%;
        min-height: 100%;
        width: auto;
        height: auto;
        z-index: 1;
        transform: translate(-50%, -50%);
        object-fit: cover;
      }
      .video-content {
        position: relative;
        z-index: 2; /* Garante que o texto fica por cima do vídeo */
        text-align: center;
        color: white;
        background-color: rgba(
          0,
          0,
          0,
          0.4
        ); /* Fundo translúcido para ler melhor */
        padding: 40px 60px;
        border-radius: 15px;
        backdrop-filter: blur(5px); /* Efeito de vidro focado atrás do texto */
      }
      .video-content h2 {
        font-size: 2.5rem;
        margin-bottom: 10px;
      }

      /* --- EFEITO 2: PARALLAX CORRIGIDO --- */
      .parallax-section {
        position: relative;
        height: 60vh;
        /* URL corrigido para carregar uma foto válida */
        background-image: url("https://unsplash.com");
        background-attachment: fixed; /* ESTA LINHA ATIVA O EFEITO PARALLAX */
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .parallax-content {
        text-align: center;
        color: white;
        background-color: rgba(44, 62, 80, 0.8);
        padding: 40px 60px;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      }
      .parallax-content h2 {
        font-size: 2.5rem;
        margin-bottom: 10px;
      }

      /* Adicionada uma secção extra de espaço no fundo apenas para testar a rolagem */
      .espaco-fim {
        height: 50vh;
        background-color: #2c3e50;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
      }
    </style>
  </head>
  <body>
    <header>
      <nav class="menu-cidades">
        <a href="index.html">Home</a>
        <a href="local.html">Localização</a>
        <a href="multimedia.html">Multimédia</a>
        <a href="info.html">Informação</a>
      </nav>
    </header>

    <main>
      <!-- Secção de Destaque -->
      <section class="multi-destaque">
        <div class="imagem-container">
          <!-- Nota: Certifique-se de que a imagem existe na sua pasta images/ -->
          <img
            src="images/dnipro1.jpg"
            alt="Paisagem de Dnipro"
            class="img-full"
          />
          <h2 class="texto-emblematico">Dnipro - Paisagem Urbana</h2>
        </div>
      </section>

      <!-- Secção de Fotos -->
      <section class="multi-fotos">
        <h2>Fotografias</h2>
        <br />
        <img
          src="https://images.unsplash.com/photo-1497436072909-60f360e1d4b1?auto=format&fit=crop&w=500&q=60"
          alt="Foto de Dnipro"
          class="foto-efeito"
        />
      </section>

      <!-- Efeito 1: Vídeo de Fundo -->
      <section class="video-bg-section">
        <video autoplay loop muted playsinline class="video-bg">
          <source
            src="https://cdn.pixabay.com/video/2020/05/25/40144-424855424_tiny.mp4"
            type="video/mp4"
          />
          O seu browser não suporta tags de vídeo.
        </video>
        <div class="video-content">
          <h2>Relaxamento Visual</h2>
          <p>Vídeo em background a funcionar.</p>
        </div>
      </section>

      <!-- Efeito 2: Parallax -->
      <section class="parallax-section">
        <div class="parallax-content">
          <h2>Efeito Parallax</h2>
          <p>Faz scroll para cima e para baixo para veres o efeito.</p>
        </div>
      </section>

      <!-- Secção extra apenas para dar margem de scroll -->
      <section class="espaco-fim">
        <p>Fim da página multimédia.</p>
      </section>
    </main>
  </body>
</html>
