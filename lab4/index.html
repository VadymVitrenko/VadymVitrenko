<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laboratório 4 - Eventos</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Laboratório 4: Introdução aos Eventos</h1>
    </header>

    <main>
      <section>
        <p>
          Esta página demonstra a utilização de diferentes eventos de rato em
          JavaScript.
        </p>
      </section>

      <!-- Espaço para o Contador -->
      <section>
        <h2>Contador: <span id="counter-value">0</span></h2>
        <button id="btn-click" onclick="counter()">Clique Aqui</button>
        <button id="btn-double">Duplo Clique</button>
      </section>

      <!-- Espaço para a Imagem Interativa -->
      <section>
        <h2>Interação com Imagem</h2>
        <!-- Certifica-te de que tens uma imagem na tua pasta images/ -->
        <img
          id="interactive-img"
          src="images/JavaScript-Logo.jpg"
          alt="Imagem do Projeto"
          style="width: 200px; cursor: pointer"
        />
        <p id="mouse-coords">
          Mova o rato sobre a imagem para ver as coordenadas.
        </p>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 - Engenharia Informática Lusófona</p>
    </footer>

    <script src="main.js"></script>
  </body>
</html>
