<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <title>Demo 8 - Position (Texto sobre Imagem)</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 20px;
      }

      h2 {
        color: #d84315;
        text-align: center;
      }

      /* 1. Elemento contentor relativo (ponto de referência) */
      .cartao-imagem {
        position: relative; /* FUNDAMENTAL: serve de âncora para o elemento absoluto */
        width: 550px;
        max-width: 100%;
        margin: 30px auto;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
      }

      /* Imagem que ocupa toda a largura do contentor */
      .cartao-imagem img {
        width: 100%;
        height: auto;
        display: block;
      }

      /* 2. Elemento sobreposto com position: absolute */
      .texto-sobreposto {
        position: absolute; /* Posiciona o bloco relativamente ao .cartao-imagem */
        bottom: 25px; /* Distância em relação à base da imagem */
        left: 25px; /* Distância em relação à margem esquerda */
        right: 25px; /* Faz com que ocupe a largura até ao lado direito */

        background-color: rgba(
          0,
          0,
          0,
          0.65
        ); /* Fundo preto semitransparente para legibilidade */
        color: #ffffff;
        padding: 15px 20px;
        border-radius: 6px;
        backdrop-filter: blur(4px);
      }

      .texto-sobreposto h3 {
        margin: 0 0 5px 0;
        font-size: 1.25rem;
        color: #ffab91;
      }

      .texto-sobreposto p {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h2>Demonstração da Propriedade Position - Vadym Vitrenko</h2>

    <div class="cartao-imagem">
      <!-- Imagem de demonstração pública -->
      <img src="https://picsum.photos/600/350" alt="Paisagem de Demonstração" />

      <!-- Texto posicionado em cima da imagem -->
      <div class="texto-sobreposto">
        <h3>Vadym Vitrenko</h3>
        <p>
          Texto perfeitamente sobreposto à imagem utilizando
          <code>position: absolute</code> dentro de um contentor pai com
          <code>position: relative</code>.
        </p>
      </div>
    </div>
  </body>
</html>
