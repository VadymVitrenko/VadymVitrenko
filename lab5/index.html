<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 5</title>
  </head>
  <body>
    <!-- 1. Passa por aqui! (Evento: mouseover / mouseleave) -->
    <div style="margin-bottom: 20px">
      <span id="elemento-passar" style="font-size: 1.2rem; cursor: pointer"
        >1. Passa por aqui!</span
      >
    </div>

    <!-- 2. Pinta-me! (Evento: click nos botões para mudar cor de fundo ou texto) -->
    <div style="margin-bottom: 20px">
      <span style="font-size: 1.2rem; color: red; font-weight: bold"
        >2. Pinta-me!</span
      >
      <button id="btn-red">Red</button>
      <button id="btn-green">Green</button>
      <button id="btn-blue">Blue</button>
    </div>

    <!-- 3. Experimenta escrever... (Evento: input / keyup / change) -->
    <div style="margin-bottom: 20px">
      <label for="campo-escrita" style="font-size: 1.2rem"
        >3. Experimenta escrever...</label
      >
      <input type="text" id="campo-escrita" style="background-color: #b4dbdc" />
    </div>

    <!-- 4. Escolha uma cor em inglês (Evento: click no botão ou submit de formulário) -->
    <div style="margin-bottom: 20px">
      <label for="campo-cor" style="font-size: 1.2rem"
        >4. Escolha uma cor em inglês:</label
      >
      <input type="text" id="campo-cor" value="p" />
      <button id="btn-submeter">submeter</button>
    </div>

    <!-- 5. Conta! (Evento: click para incrementar o contador) -->
    <div style="margin-bottom: 20px">
      <span style="font-size: 1.2rem">5. </span>
      <button id="btn-conta">Conta!</button>
      <span id="valor-contador" style="font-size: 1.2rem; margin-left: 5px"
        >33</span
      >
    </div>
  </body>
</html>
