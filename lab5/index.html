<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 5</title>
    <!-- Ligação ao ficheiro CSS -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- 1. Passa por aqui! -->
    <div style="margin-bottom: 20px">
      <span id="elemento-passar" style="font-size: 1.2rem; cursor: pointer"
        >1. Passa por aqui!</span
      >
    </div>

    <!-- 2. Pinta-me! -->
    <div style="margin-bottom: 20px">
      <span style="font-size: 1.2rem; color: red; font-weight: bold"
        >2. Pinta-me!</span
      >
      <button class="color" data-color="red">Red</button>
      <button class="color" data-color="green">Green</button>
      <button class="color" data-color="blue">Blue</button>
    </div>

    <!-- 3. Experimenta escrever... -->
    <div style="margin-bottom: 20px">
      <label for="campo-escrita" style="font-size: 1.2rem"
        >3. Experimenta escrever...</label
      >
      <input type="text" id="campo-escrita" style="background-color: #b4dbdc" />
    </div>

    <!-- 4. Escolha uma cor (com select e this) -->
    <div style="margin-bottom: 20px">
      <label for="select-cor" style="font-size: 1.2rem"
        >4. Escolha uma cor:</label
      >
      <select id="select-cor">
        <option value="white">Selecione uma cor</option>
        <option value="red">Red</option>
        <option value="green">Green</option>
        <option value="blue">Blue</option>
        <option value="purple">Purple</option>
      </select>
    </div>

    <!-- 5. Conta! -->
    <div style="margin-bottom: 20px">
      <span style="font-size: 1.2rem">5. </span>
      <button id="btn-conta">Conta!</button>
      <span id="valor-contador" style="font-size: 1.2rem; margin-left: 5px"
        >33</span
      >
    </div>

    <hr />

    <!-- NOVO: Select flex -->
    <div style="margin-top: 20px">
      <h3>Select flex</h3>
      <label for="select-flex">Direção:</label>
      <select id="select-flex" style="margin-bottom: 10px">
        <option value="row">row</option>
        <option value="row-reverse">row-reverse</option>
        <option value="column">line</option>
        <option value="column-reverse">line-reverse</option>
      </select>

      <div class="container" id="container-flex">
        <div class="bola"></div>
        <div class="bola"></div>
        <div class="bola"></div>
        <div class="bola"></div>
      </div>
    </div>

    <!-- Ligação ao ficheiro JavaScript -->
    <script src="main.js"></script>
    <!-- Exercício: Formulário onsubmit -->
    <div style="margin-top: 30px">
      <form id="meu-formulario">
        <input id="nome" type="text" placeholder="insira o seu nome" required />
        <input
          id="idade"
          type="number"
          placeholder="insira a sua idade"
          required
        />
        <input type="submit" value="Submeter" />
      </form>

      <!-- Parágrafo onde a mensagem vai ser mostrada -->
      <p
        id="mensagem"
        style="font-size: 1.2rem; font-weight: bold; margin-top: 10px"
      ></p>
    </div>
    <!-- Exercício: Contador com Local Storage -->
    <div style="margin-top: 30px">
      <h3>Contador com Local Storage</h3>
      <h1 id="contador-ls">0</h1>
      <button id="btn-inc">+ Incrementar</button>
      <button id="btn-dec">- Decrementar</button>
      <button id="btn-res">Reset</button>
    </div>
    <!-- Exercício: Temporizador com setInterval -->
    <div style="margin-top: 30px">
      <h3>Temporizador Automático</h3>
      <span id="valor-temporizador" style="font-size: 1.5rem; font-weight: bold"
        >0</span
      >
    </div>
  </body>
</html>
