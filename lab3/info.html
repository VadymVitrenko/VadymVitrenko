<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Informações - Dnipro</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .info-titulo {
        text-align: center;
        padding: 20px;
        color: #333;
      }
      .info-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        padding: 40px;
        max-width: 900px;
        margin: 0 auto;
      }
      .bloco-largo {
        grid-column: 1 / 3;
        background-color: #34495e;
        color: white;
        padding: 50px;
        border-radius: 10px;
        text-align: center;
      }
      .bloco-texto {
        background-color: #2c3e50;
        color: white;
        padding: 40px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        text-align: center;
      }
      .imagem-grid {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 10px;
      }
      @media (max-width: 768px) {
        .info-grid {
          grid-template-columns: 1fr;
        }
        .bloco-largo {
          grid-column: 1 / 2;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <nav class="menu-cidades">
        <a href="index.html">Home</a>
        <a href="local.html">Localização</a>
        <a href="multimedia.html">Multimédia</a>
        <a href="info.html">Informação</a>
      </nav>
    </header>

    <main>
      <h1 class="info-titulo">Cultura e Informações</h1>
      <div class="info-grid">
        <div class="bloco-largo">
          <p>
            Dnipro é famosa pela sua arquitetura e cultura. Este bloco está
            posicionado especificamente para ocupar duas colunas na nossa grelha
            2D.
          </p>
        </div>
        <div class="bloco-texto">
          <p>
            O espaço vazio à esquerda foi deixado de propósito para dar "peso"
            ao web design.
          </p>
        </div>
        <div>
          <img
            src="https://images.unsplash.com/photo-1540932239986-30128078f3c5?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80"
            alt="Cultura de Dnipro"
            class="imagem-grid"
          />
        </div>
      </div>
    </main>
  </body>
</html>
