<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multimédia</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <nav class="menu-cidades">
        <a href="index.html">Home</a>
        <a href="local.html">Localização</a>
        <a href="multimedia.html">Multimédia</a>
        <a href="info.html">Informação</a>
      </nav>
    </header>

    <main>
      <!-- Secção 1: Imagem gigante com texto por cima (position absolute e vw) -->
      <section class="multi-destaque">
        <div class="imagem-container">
          <img
            src="https://images.unsplash.com/photo-1506744626753-edaebc4b81a4?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80"
            alt="Paisagem de Dnipro"
            class="img-full"
          />
          <h2 class="texto-emblematico">A beleza do esforço mínimo</h2>
        </div>
      </section>

      <!-- Secção 2: Fotografias (com o Efeito transition) -->
      <section class="multi-fotos">
        <h2>Fotografias</h2>
        <br />
        <img
          src="https://images.unsplash.com/photo-1497436072909-60f360e1d4b1?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=60"
          alt="Foto pequena"
          class="foto-efeito"
        />
      </section>

      <!-- SECÇÃO NOVA: Vídeo Background -->
      <section class="video-bg-section">
        <!-- Vídeo aleatório do Pixabay -->
        <video autoplay loop muted playsinline class="video-bg">
          <source
            src="https://cdn.pixabay.com/video/2020/05/25/40144-424855424_tiny.mp4"
            type="video/mp4"
          />
        </video>
        <div class="video-content">
          <h2>Relaxamento Visual</h2>
          <p>Vídeo em background a funcionar.</p>
        </div>
      </section>

      <!-- SECÇÃO NOVA: Efeito Parallax -->
      <section class="parallax-section">
        <div class="parallax-content">
          <h2>Efeito Parallax</h2>
          <p>Faz scroll para cima e para baixo para veres o efeito.</p>
        </div>
      </section>
    </main>
  </body>
</html>
