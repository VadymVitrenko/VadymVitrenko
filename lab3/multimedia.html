<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multimédia - Dnipro</title>
    <!-- Liga ao teu ficheiro CSS único -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Menu Global Fixo -->
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="local.html">Localização</a></li>
        <li><a href="multimedia.html">Multimédia</a></li>
        <li><a href="info.html">Informação</a></li>
      </ul>
    </nav>

    <main>
      <!-- Destaque Principal com imagem real -->
      <section class="multi-destaque">
        <div class="imagem-container">
          <img
            src="images/dnipro1.jpg"
            alt="Paisagem de Dnipro"
            class="img-full"
          />
          <h2 class="texto-emblematico">
            Dnipro <br /><span style="font-size: 2rem; font-weight: 300"
              >Paisagem Urbana</span
            >
          </h2>
        </div>
      </section>

      <!-- Galeria de Fotos com imagem real -->
      <section class="multi-fotos">
        <h2>Fotografias</h2>
        <img
          src="images/dnipro2.jpg"
          alt="Foto de Dnipro"
          class="foto-efeito"
        />
      </section>

      <!-- Efeito Vídeo de Fundo -->
      <section class="video-bg-section">
        <video autoplay loop muted playsinline class="video-bg">
          <source src="https://mixkit.co" type="video/mp4" />
        </video>
        <div class="video-content">
          <h2>Relaxamento Visual</h2>
          <p>Vídeo em background integrado com sucesso.</p>
        </div>
      </section>

      <!-- Efeito Parallax Fixo -->
      <section class="parallax-section">
        <div class="parallax-content">
          <h2>Efeito Parallax</h2>
          <p>Faz scroll para cima e para baixo para veres o efeito dinâmico.</p>
        </div>
      </section>

      <!-- Rodapé -->
      <section class="espaco-fim">
        <p>Fim da página multimédia • Interfaces Web</p>
      </section>
    </main>
  </body>
</html>
