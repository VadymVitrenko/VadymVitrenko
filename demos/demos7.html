<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <!-- Tag fundamental para ativar a responsividade nos DevTools -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lisboa - DevTools Responsividade</title>
    <style>
      body {
        font-family: serif;
        margin: 20px;
        line-height: 1.5;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 10px;
      }

      nav a {
        color: blue;
        font-size: 0.9rem;
        margin-right: 8px;
        text-decoration: underline;
      }

      img {
        max-width: 100%;
        height: auto;
        width: 320px;
        margin-top: 15px;
        display: block;
      }

      h2 {
        font-size: 1.2rem;
        margin-top: 20px;
        margin-bottom: 5px;
      }

      p {
        margin: 4px 0;
        font-size: 0.95rem;
      }

      footer {
        margin-top: 25px;
        font-size: 0.85rem;
        color: #333;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Lisboa</h1>
      <nav>
        <a href="#">Home</a>
        <a href="#">Localização</a>
        <a href="#">Multimédia</a>
        <a href="#">Informação</a>
      </nav>
    </header>

    <main>
      <img
        src="https://images.unsplash.com/photo-1513682125134-76d1ec922950?w=600"
        alt="Lisboa"
      />

      <h2>Home</h2>
      <p>Este website fala sobre a cidade de lisboa!</p>
      <p>
        Nele encontra informação sobre a sua localização, conteúdos multimédia e
        informação variada.
      </p>
    </main>

    <footer>
      <!-- Identificação obrigatória do aluno -->
      <p>Portugal, 2024 - Vadym</p>
    </footer>
  </body>
</html>
