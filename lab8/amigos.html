<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <title>API Amigos - Todos os Métodos</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 20px;
        line-height: 1.6;
      }
      section {
        border: 1px solid #ccc;
        padding: 15px;
        margin-bottom: 20px;
        border-radius: 6px;
      }
      input,
      button {
        margin: 5px 0;
        padding: 6px;
      }
    </style>
  </head>
  <body>
    <h1>API amigos</h1>

    <!-- 1. GET (Список) -->
    <section>
      <h2>1. Список друзей (GET)</h2>
      <button onclick="carregarAmigos()">Обновить список</button>
      <ul id="lista-amigos"></ul>
    </section>

    <!-- 2. POST (Создание) -->
    <section>
      <h2>2. Добавить друга (POST)</h2>
      <input type="text" id="nome" placeholder="Имя" /><br />
      <input type="number" id="idade" placeholder="Возраст" /><br />
      <button onclick="criarAmigo()">Создать</button>
    </section>

    <!-- 3. PUT (Изменение) -->
    <section>
      <h2>3. Обновить друга (PUT)</h2>
      <input type="number" id="put-id" placeholder="ID друга" /><br />
      <input type="text" id="put-nome" placeholder="Новое имя" /><br />
      <input type="number" id="put-idade" placeholder="Новый возраст" /><br />
      <button onclick="atualizarAmigo()">Обновить</button>
    </section>

    <!-- 4. DELETE (Удаление) -->
    <section>
      <h2>4. Удалить друга (DELETE)</h2>
      <input type="number" id="delete-id" placeholder="ID для удаления" /><br />
      <button onclick="apagarAmigo()">Удалить</button>
    </section>

    <script>
      const API_URL = "https://amigos.pw.deisi.ulusofona.pt/amigos";

      // GET: Загрузить список
      function carregarAmigos() {
        fetch(API_URL)
          .then((res) => res.json())
          .then((data) => {
            const ul = document.getElementById("lista-amigos");
            ul.innerHTML = "";
            data.forEach((amigo) => {
              const li = document.createElement("li");
              li.textContent = `${amigo.nome}, ${amigo.idade} anos (ID: ${amigo.id})`;
              ul.appendChild(li);
            });
          })
          .catch((err) => console.error("Erro no GET:", err));
      }

      // POST: Создать
      function criarAmigo() {
        const nome = document.getElementById("nome").value;
        const idade = document.getElementById("idade").value;

        fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nome: nome, idade: Number(idade) }),
        })
          .then(() => carregarAmigos())
          .catch((err) => console.error("Erro no POST:", err));
      }

      // PUT: Обновить
      function atualizarAmigo() {
        const id = document.getElementById("put-id").value;
        const nome = document.getElementById("put-nome").value;
        const idade = document.getElementById("put-idade").value;

        fetch(`${API_URL}/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nome: nome, idade: Number(idade) }),
        })
          .then(() => carregarAmigos())
          .catch((err) => console.error("Erro no PUT:", err));
      }

      // DELETE: Удалить
      function apagarAmigo() {
        const id = document.getElementById("delete-id").value;

        fetch(`${API_URL}/${id}`, {
          method: "DELETE",
        })
          .then(() => carregarAmigos())
          .catch((err) => console.error("Erro no DELETE:", err));
      }

      // Автоматически загружаем список при открытии
      carregarAmigos();
    </script>
  </body>
</html>
