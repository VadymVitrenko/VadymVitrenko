<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 8</title>
  </head>
  <body>
    <ul></ul>

    <script>
      url = "https://amigos.pw.deisi.ulusofona.pt/amigos";
      const ul_node = document.querySelector("ul");

      fetch(url)
        .then((response) => {
          return response.json();
        })
        .then((data) => {
          console.log(data);
          data.forEach((amigo) => {
            li = document.createElement("li");
            li.textContent = amigo.nome;
            ul_node.append(li);
          });
        })
        .catch((error) => console.log(error.message));
    </script>
  </body>
</html>
