<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Loja</title>
  </head>

  <body>
    <header>
      <h1>A minha Loja</h1>
      <nav>
        <ul>
          <li><a href="#lista-produtos">Produtos</a></li>
          <li><a href="#cesto">Cesto</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <!-- Barra de controlos: Filtro, Ordenação e Pesquisa -->
      <div class="filters-container">
        <label for="filter-category">Filtrar:</label>
        <select id="filter-category">
          <option value="todas">Todas as categorias</option>
        </select>

        <label for="sort-price">Ordenar:</label>
        <select id="sort-price">
          <option value="">Ordenar pelo preço</option>
          <option value="crescente">Preço Crescente</option>
          <option value="decrescente">Preço Decrescente</option>
        </select>

        <label for="search-product">Procurar:</label>
        <input
          type="text"
          id="search-product"
          placeholder="pesquise por produto"
        />
      </div>

      <!-- A secção dos produtos fica aqui -->
      <section id="lista-produtos"></section>

      <!-- A secção do cesto -->
      <section id="cesto"></section>
    </main>

    <!-- O rodapé -->
    <footer>@2026 Vadym Vitrenko</footer>

    <!-- O script a carregar -->
    <script src="script.js"></script>
  </body>
</html>
