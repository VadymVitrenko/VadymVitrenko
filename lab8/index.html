<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Loja</title>
  </head>

  <body>
    <header>
      <h1>A minha Loja</h1>
      <nav>
        <ul>
          <li><a href="#lista-produtos">Produtos</a></li>
          <li><a href="#cesto">Cesto</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <!-- A secção dos produtos fica aqui, dentro do main -->
      <section id="lista-produtos"></section>

      <!-- A secção do cesto fica reservada para os próximos passos -->
      <section id="cesto"></section>

      <label for="filter-category">Filtrar por:</label>
      <select id="filter-category">
        <option value="todas">Todas as categorias</option>
        <!-- As restantes opções vão ser carregadas dinamicamente via JS -->
      </select>

      <label for="sort-price">Ordenar:</label>
      <select id="sort-price">
        <option value="">Ordenar pelo preço</option>
        <option value="crescente">Preço Crescente</option>
        <option value="decrescente">Preço Decrescente</option>
      </select>

      <!-- NOVO: Procurar por nome -->
      <label for="search-product">Procurar:</label>
      <input
        type="text"
        id="search-product"
        placeholder="pesquise por produto"
      />
    </main>

    <!-- O rodapé fica mesmo no fim de todo o conteúdo visual -->
    <footer>@2026 Vadym Vitrenko</footer>

    <!-- Os scripts no fim, na ordem exata de execução -->
    <script src="script.js"></script>
  </body>
</html>
