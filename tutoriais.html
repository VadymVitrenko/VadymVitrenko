<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tutoriais - Vadym Vitrenko</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        font-family: sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 0;
      }
      .nav-voltar {
        background-color: #2c3e50;
        padding: 15px 25px;
      }
      .nav-voltar a {
        color: white;
        text-decoration: none;
        font-weight: bold;
      }
      main {
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px;
      }
      section {
        background: white;
        padding: 30px;
        margin-bottom: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      }
      h1 {
        margin-bottom: 25px;
        color: #2c3e50;
      }
      h2 {
        color: #34495e;
        border-bottom: 2px solid #ecf0f1;
        padding-bottom: 10px;
        margin-bottom: 20px;
      }
      .media-wrapper {
        position: relative;
        padding-bottom: 56.25%; /* 16:9 */
        height: 0;
        overflow: hidden;
        margin-top: 15px;
      }
      .media-wrapper iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <header>
      <nav class="nav-voltar">
        <a href="index.html">← Voltar à Página Principal</a>
      </nav>
    </header>

    <main>
      <h1>Tutoriais e Recursos</h1>

      <!-- Secção a: Videotutoriais -->
      <section>
        <h2>Videotutoriais</h2>
        <p>Tutoriais em vídeo de apoio ao desenvolvimento de interfaces web:</p>
        <div class="media-wrapper">
          <!-- Podes trocar este link por um vídeo de tutorial da disciplina ou do YouTube -->
          <iframe
            src="https://www.youtube.com/embed/videoseries?list=PL4cUxeGkcC9ivBf_eKCPIAYXWzLlPAm6G"
            title="Videotutoriais"
            allowfullscreen
          >
          </iframe>
        </div>
      </section>

      <!-- Secção b: CodePens -->
      <section>
        <h2>CodePens</h2>
        <p>Exemplos e exercícios práticos desenvolvidos no CodePen:</p>
        <div class="media-wrapper">
          <!-- Podes colocar o iframe de um dos teus CodePens ou de um exercício de aula -->
          <iframe src="https://codepen.io" title="CodePens" loading="lazy">
          </iframe>
        </div>
      </section>
    </main>
  </body>
</html>
